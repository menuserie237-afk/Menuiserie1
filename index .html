<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TGG Bois – Menuiserie et meubles sur mesure à Douala</title>
<meta name="description" content="Transformation Globale Génie Bois, menuiserie face au stade Japoma à Douala : salons, lits, armoires, tables, portes, lambris. Meubles en stock ou fabriqués sur commande.">
<meta property="og:title" content="TGG Bois – Menuiserie à Douala">
<meta property="og:description" content="Meubles en stock et fabrication sur mesure. Devis par WhatsApp.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--b1:#4A2E20;--b2:#2D211B;--beige:#F5F0E8;--cu:#B87345;--g:#075C43;--g2:#DDF7E5;--bg:#F3F4F2;--tx:#292929;--tx2:#737373;--red:#DC2626}
*{box-sizing:border-box;margin:0}
body{font:16px/1.55 Inter,system-ui,sans-serif;color:var(--tx);background:var(--beige);overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--cu);outline-offset:2px}
h1,h2,h3{line-height:1.1;letter-spacing:-.02em;font-weight:800}
.slats{background:repeating-linear-gradient(90deg,var(--b2) 0 16px,var(--cu) 16px 19px,var(--b1) 19px 38px)}
.wrap{max-width:1120px;margin:auto;padding:0 20px}
.btn{display:inline-block;border:0;border-radius:6px;padding:12px 20px;font:600 15px Inter,sans-serif;cursor:pointer;text-decoration:none;background:var(--b1);color:#fff}
.btn.cu{background:var(--cu)}.btn.wa{background:var(--g)}.btn.out{background:none;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}.btn.sm{padding:7px 12px;font-size:13px}.btn.red{background:var(--red)}
header.nav{position:sticky;top:0;z-index:20;background:var(--b2);color:#fff}
.nav .wrap{display:flex;align-items:center;gap:22px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:18px}
.mark{width:38px;height:38px;border-radius:50%;border:2px solid var(--cu);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--cu);overflow:hidden}
.mark img{width:100%;height:100%;object-fit:cover}
.nav nav{display:flex;gap:20px;margin-left:auto;font-size:14px}
.nav nav a{text-decoration:none;opacity:.85}.nav nav a:hover{opacity:1;color:var(--cu)}
.burger{display:none;margin-left:auto;background:none;border:1px solid #fff5;color:#fff;border-radius:6px;padding:6px 10px;font-size:18px}
.hero{background:var(--b2);color:#fff;display:grid;grid-template-columns:1.1fr .9fr;min-height:520px}
.hero .txt{padding:64px 6vw;align-self:center;max-width:640px}
.hero h1{font-size:clamp(34px,5vw,58px);margin-bottom:18px}
.hero p{color:#e7dccf;margin-bottom:28px;max-width:46ch}
.hero .btns{display:flex;gap:12px;flex-wrap:wrap}
.hero .pic{position:relative;background-size:cover;background-position:center}
.hero .pic span{position:absolute;left:0;bottom:0;background:var(--beige);color:var(--b1);padding:12px 18px;font-weight:600;font-size:14px}
section{padding:64px 0}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(26px,3.4vw,36px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.cat{background:var(--bg);border-radius:8px;overflow:hidden;text-decoration:none;cursor:pointer;border:0;text-align:left;font:inherit;padding:0}
.cat .ph{aspect-ratio:4/3;background:#e4ddd2 center/cover}
.cat b{display:block;padding:12px 14px}
.card{background:#fff;border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.card .ph{aspect-ratio:1;background:var(--bg) center/cover;cursor:pointer}
.card .in{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card small{color:var(--tx2)}
.price{font-weight:800;color:var(--b1)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--g2);color:var(--g);width:max-content}
.badge.o{background:#f3e3d4;color:var(--b1)}.badge.x{background:#fde4e4;color:var(--red)}
.card .act{margin-top:auto;display:grid;gap:8px;padding-top:8px}
.dark{background:var(--b1);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
form.f{display:grid;gap:12px}
label{font-size:13px;font-weight:600;display:grid;gap:4px}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid #cfc7bb;border-radius:6px;background:#fff;color:var(--tx);width:100%}
.dark label{color:#fff}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.tools input,.tools select{width:auto;flex:1;min-width:150px}
.empty{background:#fff;border:1px dashed #cfc7bb;border-radius:8px;padding:32px;text-align:center;color:var(--tx2)}
.modal{position:fixed;inset:0;background:#000a;z-index:50;display:grid;place-items:center;padding:16px;overflow:auto}
.modal .box{background:#fff;border-radius:10px;max-width:820px;width:100%;padding:24px;position:relative;max-height:92vh;overflow:auto}
.modal .x{position:absolute;right:12px;top:10px;background:none;border:0;font-size:26px;cursor:pointer}
.gal{display:flex;gap:8px;overflow-x:auto;margin-top:8px}.gal img{height:70px;border-radius:4px;cursor:pointer}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99;display:grid;gap:8px}
#toast div{background:var(--b2);color:#fff;padding:12px 18px;border-radius:8px;font-size:14px}#toast .e{background:var(--red)}
.fab{position:fixed;right:16px;bottom:16px;z-index:30;background:var(--g);color:#fff;border-radius:99px;padding:12px 18px;font-weight:600;text-decoration:none;box-shadow:0 4px 14px #0004}
footer{background:var(--b2);color:#d9cfc2;padding:40px 0 90px;font-size:14px}
footer .wrap{display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px}
/* admin */
.adm{display:grid;grid-template-columns:230px 1fr;min-height:100vh;background:var(--bg)}
.side{background:#fff;margin:14px;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:4px;position:sticky;top:14px;height:calc(100vh - 28px)}
.side button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;font:500 14px Inter;cursor:pointer;color:var(--tx)}
.side button.on{background:var(--g);color:#fff}
.main{padding:14px 20px 40px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.stat{background:#fff;border-radius:14px;padding:18px}.stat.hi{background:var(--g);color:#fff}
.stat b{font-size:34px;display:block;line-height:1.1}.stat span{font-size:13px;opacity:.75}
.panel{background:#fff;border-radius:14px;padding:18px;overflow-x:auto;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 8px;text-align:left;border-bottom:1px solid #eee;vertical-align:middle}th{color:var(--tx2);font-weight:500}
td img{width:44px;height:44px;object-fit:cover;border-radius:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{height:10px;border-radius:5px;background:var(--cu);margin-top:4px}
@media(max-width:820px){
.nav nav{display:none;position:absolute;top:64px;left:0;right:0;background:var(--b2);flex-direction:column;padding:16px 20px;margin:0}.nav nav.open{display:flex}.burger{display:block}
.hero,.two,footer .wrap{grid-template-columns:1fr}.hero .pic{min-height:200px;order:-1}.hero .txt{padding:36px 20px}
.adm{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow-x:auto;margin:10px;padding:8px}.side button{white-space:nowrap}.side .logo{display:none}
.grid2{grid-template-columns:1fr}section{padding:44px 0}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"><p style="padding:40px;font:16px sans-serif;color:#4A2E20">Chargement de TGG Bois…</p></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== CONFIGURATION : seul endroit à modifier ===== */
const C={
  TEST_MODE:true,                    // false en production
  WHATSAPP_TEST:"237695657754",      // numéro d'essai
  WHATSAPP_PROD:"237679780576",      // numéro officiel TGG Bois
  SUPABASE_URL:"https://hzcfgxsjwmgvvridafrw.supabase.co",                   // à renseigner après création du projet
  SUPABASE_ANON_KEY:"sb_publishable_gZ7obr2EmIyS9DeAasm4Rw_XeU5wqjY",              // clé publique "anon" uniquement, jamais service_role
  LOGO_URL:"",                       // logo officiel quand une version nette existe
  HERO_URL:""                        // photo réelle d'un meuble TGG Bois (facultatif)
};
const WA=C.TEST_MODE?C.WHATSAPP_TEST:C.WHATSAPP_PROD;
const wa=t=>`https://wa.me/${WA}?text=${encodeURIComponent(t)}`;
let db=null;
try{if(C.SUPABASE_URL&&C.SUPABASE_ANON_KEY&&window.supabase)db=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY)}catch(e){console.error(e)}
addEventListener("error",e=>{const a=document.getElementById("app");if(a&&!a.innerHTML.trim())a.innerHTML='<p style="padding:30px;font:15px sans-serif">Erreur d\'affichage : '+String(e.message).replace(/</g,"&lt;")+'</p>'});
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const xaf=n=>new Intl.NumberFormat("fr-FR").format(n)+" FCFA";
const toast=(m,e)=>{const d=document.createElement("div");d.textContent=m;if(e)d.className="e";$("#toast").append(d);setTimeout(()=>d.remove(),4500)};
const S={cats:[],prods:[],loaded:false,err:"",q:"",cat:"",avail:"",sort:"",user:null,admin:false,view:"dash"};
const SALES={en_stock:"En stock",sur_commande:"Sur commande",mixte:"Stock ou sur commande"};
const QSTAT=["Nouvelle demande","Client contacté","Devis envoyé","En attente de confirmation","Confirmée","En fabrication","Prête","Livrée","Annulée"];
const img=p=>{const l=(p.product_images||[]).slice().sort((a,b)=>(b.is_primary-a.is_primary)||(a.display_order-b.display_order));return l};
function avail(p){
  if(p.sales_type==="sur_commande")return['<span class="badge o">Sur commande</span>',true];
  if(p.stock_quantity>0)return['<span class="badge">En stock</span>',true];
  if(p.sales_type==="mixte")return['<span class="badge o">Sur commande possible</span>',true];
  return['<span class="badge x">Indisponible actuellement</span>',false];
}
function waMsg(p){
  return p.sales_type==="sur_commande"
   ?`Bonjour TGG Bois, je souhaite demander un devis pour fabriquer ${p.name}. Mes dimensions ou besoins sont les suivants : . Pouvez-vous m'indiquer les possibilités, le prix et le délai estimatif ?`
   :`Bonjour TGG Bois, je suis intéressé(e) par le produit ${p.name}. Pouvez-vous confirmer sa disponibilité, son prix et les conditions de livraison ?`;
}
const WA_GEN="Bonjour TGG Bois, je souhaite obtenir des informations sur vos meubles et services de menuiserie.";

/* ===== DONNÉES PUBLIQUES ===== */
async function load(){
  if(!db){S.loaded=true;S.err="nodb";return}
  try{
    const [c,p]=await Promise.all([
      db.from("categories").select("*").eq("is_active",true).order("name"),
      db.from("products").select("*,categories(name),product_images(image_url,alt_text,is_primary,display_order)").eq("is_published",true).order("created_at",{ascending:false})]);
    if(c.error||p.error)throw c.error||p.error;
    S.cats=c.data;S.prods=p.data;S.err="";
  }catch(e){S.err="net"}
  S.loaded=true;
}
const notice=()=>S.err==="nodb"?'<div class="empty">Base de données non configurée : le catalogue est vide tant que les clés Supabase ne sont pas renseignées.</div>'
 :S.err==="net"?'<div class="empty">Impossible de charger les meubles pour le moment. Vérifiez votre connexion et réessayez, ou écrivez-nous sur WhatsApp.</div>':"";

function pcard(p){
  const [b,ok]=avail(p),im=img(p)[0];
  return `<article class="card"><div class="ph" role="img" aria-label="${esc(im?.alt_text||p.name)}" style="${im?`background-image:url('${esc(im.image_url)}')`:""}" onclick="location.hash='#/produit/${p.id}'"></div>
  <div class="in"><small>${esc(p.categories?.name||"")}</small><h3 style="font-size:17px">${esc(p.name)}</h3>${b}
  <span class="price">${p.price_xaf?xaf(p.price_xaf):"Prix sur demande"}</span>
  <div class="act"><a class="btn sm" href="#/produit/${p.id}">Voir le produit</a><a class="btn sm wa" target="_blank" rel="noopener" href="${wa(waMsg(p))}">Commander sur WhatsApp</a></div></div></article>`;
}

/* ===== VITRINE ===== */
function shell(inner){
  return `<header class="nav"><div class="wrap"><a class="logo" href="#/">${logo()}TGG Bois</a>
  <button class="burger" aria-label="Menu" onclick="document.getElementById('nv').classList.toggle('open')">&#9776;</button>
  <nav id="nv" onclick="this.classList.remove('open')"><a href="#/">Accueil</a><a href="#/catalogue">Catalogue</a><a href="#/#surmesure">Sur commande</a><a href="#/#realisations">Réalisations</a><a href="#/#apropos">À propos</a><a href="#/#contact">Contact</a><a href="#/catalogue" aria-label="Rechercher">Rechercher</a></nav></div></header>
  ${inner}
  <a class="fab" target="_blank" rel="noopener" href="${wa(WA_GEN)}">WhatsApp</a>
  <footer><div class="wrap"><div><a class="logo" href="#/" style="color:#fff">${logo()}TGG Bois</a><p style="margin-top:10px;max-width:42ch">Transformation Globale Génie Bois. Menuiserie, mobilier et aménagement intérieur à Douala.</p></div>
  <div><b>Liens</b><p><a href="#/catalogue">Catalogue</a><br><a href="#/#surmesure">Devis</a><br><a href="#/#contact">Contact</a></p></div>
  <div><b>Atelier</b><p>Face au stade Japoma, Douala<br><a href="tel:+237679780576">+237 679 78 05 76</a><br><a href="#/admin" style="opacity:.5">Administration</a></p></div></div>
  <div class="wrap" style="display:block;margin-top:20px;opacity:.6">© ${new Date().getFullYear()} TGG Bois. Les données saisies dans les formulaires servent uniquement à traiter votre demande.</div></footer>`;
}
const logo=()=>`<span class="mark">${C.LOGO_URL?`<img src="${esc(C.LOGO_URL)}" alt="Logo TGG Bois">`:"TGGB"}</span>`;

function home(){
  const feat=S.prods.filter(p=>p.is_featured).slice(0,8);
  return shell(`
  <div class="hero"><div class="txt"><h1>Transformez votre intérieur avec TGG Bois.</h1>
  <p>Mobilier, fabrication sur mesure et aménagement intérieur. Découvrez nos modèles et parlons de votre projet à Douala.</p>
  <div class="btns"><a class="btn cu" href="#/catalogue">Découvrir nos meubles</a><a class="btn out" href="#/#surmesure">Demander un devis</a></div></div>
  <div class="pic ${C.HERO_URL?"":"slats"}" ${C.HERO_URL?`style="background-image:url('${esc(C.HERO_URL)}')"`:""}><span>Face au stade Japoma, Douala</span></div></div>
  <section id="apropos"><div class="wrap two"><h2 style="font-size:clamp(26px,3.4vw,36px)">Transformation Globale Génie Bois</h2>
  <div><p>Depuis 2008, notre savoir-faire s'inscrit dans le travail du bois et la réalisation de meubles. Notre atelier, créé en 2024, poursuit cette ambition en proposant des solutions adaptées aux besoins de nos clients.</p>
  <p style="margin-top:12px;color:var(--tx2)">Salons, étagères, lits, chaises, tables, portes, pose de lambris, penderies, coiffeuses, bureaux.</p></div></div></section>
  <section style="padding-top:0"><div class="wrap"><div class="sec-h"><h2>Nos catégories</h2><a href="#/catalogue">Tout le catalogue</a></div>
  ${S.cats.length?`<div class="grid">${S.cats.map(c=>`<a class="cat" href="#/catalogue/${c.id}"><div class="ph" style="${c.image_url?`background-image:url('${esc(c.image_url)}')`:"background:repeating-linear-gradient(90deg,#4A2E20 0 12px,#B87345 12px 14px,#2D211B 14px 28px)"}"></div><b>${esc(c.name)}</b></a>`).join("")}</div>`:(notice()||'<div class="empty">Aucune catégorie publiée pour le moment.</div>')}</div></section>
  <section style="padding-top:0"><div class="wrap"><div class="sec-h"><h2>Nos meubles à découvrir</h2></div>
  ${feat.length?`<div class="grid">${feat.map(pcard).join("")}</div>`:(notice()||'<div class="empty">Les meubles vedettes apparaîtront ici dès qu\'ils seront publiés.</div>')}</div></section>
  <section class="dark" id="surmesure"><div class="wrap two"><div><h2 style="font-size:clamp(26px,3.4vw,38px);margin-bottom:14px">Un meuble adapté à votre espace ? Parlons de votre projet.</h2>
  <p>Vous avez besoin d'un meuble aux dimensions particulières ou d'un aménagement personnalisé ? Présentez-nous votre idée et contactez TGG Bois pour discuter des possibilités et demander un devis.</p></div>${quoteForm()}</div></section>
  <section id="realisations"><div class="wrap"><div class="sec-h"><h2>Nos réalisations</h2></div><div class="empty">Les photos de réalisations seront publiées ici par l'atelier. Aucune image d'exemple n'est affichée pour ne pas présenter de faux travaux.</div></div></section>
  <section id="contact" style="padding-top:0"><div class="wrap two"><h2 style="font-size:clamp(26px,3.4vw,36px)">Venir à l'atelier</h2><div><p><b>Transformation Globale Génie Bois</b><br>Face au stade Japoma, Douala, Cameroun<br>Téléphone : <a href="tel:+237679780576">+237 679 78 05 76</a></p>
  <p style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"><a class="btn wa" target="_blank" rel="noopener" href="${wa(WA_GEN)}">Écrire sur WhatsApp</a><a class="btn out" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent("Stade Japoma, Douala, Cameroun")}">Voir sur la carte</a></p></div></div></section>`);
}
function quoteForm(){
  return `<form class="f" onsubmit="sendQuote(event)" id="qf"><label>Nom<input name="n" required maxlength="80" autocomplete="name"></label>
  <div class="grid2"><label>Téléphone<input name="t" required type="tel" inputmode="tel" maxlength="20" autocomplete="tel"></label><label>Ville<input name="v" required maxlength="60" value="Douala"></label></div>
  <label>Dimensions souhaitées<input name="d" maxlength="120" placeholder="ex. 2 m x 2,4 m"></label>
  <label>Votre projet<textarea name="p" required rows="4" maxlength="1200" placeholder="Type de meuble, matériaux, finition souhaitée"></textarea></label>
  <label>Budget indicatif en FCFA (facultatif)<input name="b" type="number" min="0" inputmode="numeric"></label>
  <input name="hp" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
  <button class="btn cu" id="qb">Envoyer ma demande</button><div id="qr"></div></form>`;
}
async function sendQuote(e){
  e.preventDefault();const f=e.target,d=new FormData(f);if(d.get("hp"))return;
  const phone=d.get("t").trim();
  if(!/^[+\d\s().-]{8,20}$/.test(phone))return toast("Numéro de téléphone invalide.",1);
  const btn=$("#qb");btn.disabled=true;btn.textContent="Envoi…";
  const waLink=`<a class="btn wa" style="margin-top:10px" target="_blank" rel="noopener" href="${wa(`Bonjour TGG Bois, je viens d'envoyer une demande de devis : ${d.get("p").slice(0,200)}`)}">Poursuivre sur WhatsApp</a>`;
  try{
    if(!db)throw 0;
    const {error}=await db.from("quote_requests").insert({customer_name:d.get("n").trim(),customer_phone:phone,city:d.get("v").trim(),request_type:"sur_mesure",requested_dimensions:d.get("d")||null,project_description:d.get("p").trim(),budget_xaf:d.get("b")?parseInt(d.get("b")):null,status:"Nouvelle demande"});
    if(error)throw error;
    f.reset();$("#qr").innerHTML=`<p style="margin-top:10px">Demande enregistrée. TGG Bois vous répondra. ${waLink}</p>`;
  }catch(x){$("#qr").innerHTML=`<p style="margin-top:10px;color:#ffb4b4">Votre demande n'a pas pu être enregistrée. Contactez directement l'atelier : ${waLink}</p>`}
  btn.disabled=false;btn.textContent="Envoyer ma demande";
}

function catalogue(cid){
  if(cid&&!S.cat)S.cat=cid;
  let l=S.prods.filter(p=>(!S.q||p.name.toLowerCase().includes(S.q.toLowerCase()))&&(!S.cat||p.category_id===S.cat)&&
   (!S.avail||(S.avail==="stock"&&p.sales_type!=="sur_commande"&&p.stock_quantity>0)||(S.avail==="cmd"&&p.sales_type==="sur_commande")||(S.avail==="mixte"&&p.sales_type==="mixte")));
  if(S.sort)l=l.slice().sort((a,b)=>S.sort==="asc"?(a.price_xaf??1e12)-(b.price_xaf??1e12):(b.price_xaf??-1)-(a.price_xaf??-1));
  return shell(`<section style="padding-top:36px"><div class="wrap"><h2 style="font-size:36px;margin-bottom:20px">Catalogue</h2>
  <div class="tools"><input id="q" type="search" placeholder="Rechercher un meuble" value="${esc(S.q)}" aria-label="Recherche" oninput="S.q=this.value;fill()">
  <select aria-label="Catégorie" onchange="S.cat=this.value;fill()"><option value="">Toutes les catégories</option>${S.cats.map(c=>`<option value="${c.id}" ${S.cat===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select>
  <select aria-label="Disponibilité" onchange="S.avail=this.value;fill()"><option value="">Tous les produits</option><option value="stock" ${S.avail==="stock"?"selected":""}>En stock</option><option value="cmd" ${S.avail==="cmd"?"selected":""}>Sur commande</option><option value="mixte" ${S.avail==="mixte"?"selected":""}>Disponibles et personnalisables</option></select>
  <select aria-label="Tri" onchange="S.sort=this.value;fill()"><option value="">Plus récents</option><option value="asc" ${S.sort==="asc"?"selected":""}>Prix croissant</option><option value="desc" ${S.sort==="desc"?"selected":""}>Prix décroissant</option></select>
  <button class="btn out sm" onclick="S.q=S.cat=S.avail=S.sort='';route()">Effacer les filtres</button></div>
  <p style="margin-bottom:14px;color:var(--tx2)" id="cnt">${l.length} résultat${l.length>1?"s":""}</p>
  <div id="cl">${l.length?`<div class="grid">${l.map(pcard).join("")}</div>`:(notice()||'<div class="empty">Aucun meuble ne correspond à ces critères.</div>')}</div></div></section>`);
}
function fill(){ // met à jour la liste sans perdre le focus
  const a=$("#q"),pos=a?.selectionStart;const keep=document.activeElement===a;
  const h=catalogue().match(/<p style="margin-bottom:14px[\s\S]*?<\/div><\/div><\/section>/);
  const tmp=document.createElement("div");tmp.innerHTML=catalogue();
  $("#cnt").textContent=tmp.querySelector("#cnt").textContent;$("#cl").innerHTML=tmp.querySelector("#cl").innerHTML;
}
function produit(id){
  const p=S.prods.find(x=>x.id===id);
  if(!p)return shell(`<section><div class="wrap"><div class="empty">Ce produit n'est pas disponible. <a href="#/catalogue">Retour au catalogue</a></div></div></section>`);
  const [b,ok]=avail(p),im=img(p),row=(k,v)=>v?`<tr><th>${k}</th><td>${esc(v)}</td></tr>`:"";
  return shell(`<section style="padding-top:30px"><div class="wrap"><a href="#/catalogue">← Retour au catalogue</a><div class="two" style="margin-top:18px">
  <div>${im[0]?`<img id="big" src="${esc(im[0].image_url)}" alt="${esc(im[0].alt_text||p.name)}" style="border-radius:8px;width:100%">`:'<div class="slats" style="aspect-ratio:1;border-radius:8px"></div>'}
  <div class="gal">${im.map(i=>`<img loading="lazy" src="${esc(i.image_url)}" alt="${esc(i.alt_text||p.name)}" onclick="$('#big').src=this.src">`).join("")}</div></div>
  <div><small>${esc(p.categories?.name||"")}</small><h1 style="font-size:34px;margin:6px 0 10px">${esc(p.name)}</h1>${b}
  <p style="margin:14px 0"><b class="price" style="font-size:22px">${p.price_xaf?xaf(p.price_xaf):"Prix sur demande"}</b></p>
  <p>${esc(p.short_description)}</p><p style="margin:10px 0;white-space:pre-line;color:var(--tx2)">${esc(p.description)}</p>
  <table>${row("Type",SALES[p.sales_type])}${row("Dimensions",p.dimensions)}${row("Matériaux",p.materials)}${row("Finition",p.finish)}</table>
  <p style="margin-top:18px">${ok?"":'<span style="display:block;margin-bottom:10px">Contactez l\'atelier pour connaître les possibilités de fabrication.</span>'}<a class="btn wa" target="_blank" rel="noopener" href="${wa(waMsg(p))}">${p.sales_type==="sur_commande"?"Demander un devis sur WhatsApp":"Commander sur WhatsApp"}</a></p></div></div></div></section>`);
}

/* ===== ADMINISTRATION ===== */
function loginView(msg=""){
  return `<div style="min-height:100vh;display:grid;place-items:center;background:var(--b2);padding:16px"><form class="f" onsubmit="login(event)" style="background:#fff;padding:28px;border-radius:12px;width:100%;max-width:380px">
  <h2>Administration</h2><label>Courriel<input name="e" type="email" required autocomplete="username"></label><label>Mot de passe<input name="p" type="password" required autocomplete="current-password"></label>
  <button class="btn">Se connecter</button><button type="button" class="btn out sm" onclick="resetPw()">Mot de passe oublié</button><p style="color:var(--red)">${esc(msg)}</p><a href="#/">Retour à la vitrine</a></form></div>`;
}
async function login(e){
  e.preventDefault();if(!db)return toast("Supabase n'est pas configuré.",1);
  const d=new FormData(e.target);const {error}=await db.auth.signInWithPassword({email:d.get("e"),password:d.get("p")});
  if(error)return $("#app").innerHTML=loginView("Identifiants incorrects.");
  await route();
}
async function resetPw(){const m=prompt("Votre courriel administrateur :");if(!m||!db)return;const {error}=await db.auth.resetPasswordForEmail(m,{redirectTo:location.href.split("#")[0]});toast(error?"Envoi impossible.":"Si ce compte existe, un courriel vient d'être envoyé.",!!error)}
async function checkAdmin(){
  if(!db)return false;const {data}=await db.auth.getSession();S.user=data.session?.user||null;if(!S.user)return false;
  const {data:r}=await db.from("profiles").select("role").eq("user_id",S.user.id).maybeSingle();S.admin=r?.role==="admin";return S.admin;
}
const A={prods:[],quotes:[],moves:[]};
async function adminLoad(){
  const [p,q]=await Promise.all([db.from("products").select("*,categories(name),product_images(image_url,is_primary,display_order)").order("created_at",{ascending:false}),db.from("quote_requests").select("*").order("created_at",{ascending:false})]);
  const c=await db.from("categories").select("*").order("name");
  A.prods=p.data||[];A.quotes=q.data||[];S.cats=c.data||[];if(p.error||q.error)toast("Chargement partiel des données.",1);
}
function adminShell(inner){
  const m=[["dash","Dashboard"],["prod","Produits"],["add","Ajouter un produit"],["stock","Stock"],["quotes","Demandes de devis"]];
  return `<div class="adm"><aside class="side"><a class="logo" href="#/" style="margin-bottom:12px">${logo()}<span>TGG Bois</span></a>${m.map(x=>`<button class="${S.view===x[0]?"on":""}" onclick="S.view='${x[0]}';renderAdmin()">${x[1]}</button>`).join("")}<button style="margin-top:auto" onclick="location.hash='#/'">Retour à la vitrine</button><button onclick="logout()">Déconnexion</button></aside><main class="main">${inner}</main></div>`;
}
async function logout(){await db.auth.signOut();S.admin=false;route()}
function renderAdmin(){
  const P=A.prods,qn=A.quotes.filter(q=>q.status==="Nouvelle demande").length,conf=A.quotes.filter(q=>q.status==="Confirmée").length;
  const stat=(n,l,h)=>`<div class="stat ${h?"hi":""}"><span>${l}</span><b>${n}</b></div>`;
  const views={
  dash:()=>`<div class="top"><h2>Tableau de bord</h2><span>${esc(S.user?.email||"")}</span></div><div class="stats">
   ${stat(P.length,"Produits au total",1)}${stat(P.filter(p=>p.is_published).length,"Produits publiés")}${stat(P.filter(p=>p.sales_type!=="sur_commande"&&p.stock_quantity>0).length,"Produits en stock")}
   ${stat(P.filter(p=>p.sales_type!=="sur_commande"&&p.stock_quantity===0).length,"Produits en rupture")}${stat(P.filter(p=>p.sales_type!=="en_stock").length,"Modèles sur commande ou mixtes")}${stat(qn,"Nouvelles demandes")}${stat(conf,"Demandes confirmées")}</div>
   <div class="grid2"><div class="panel"><h3>Répartition par catégorie</h3>${S.cats.length&&P.length?S.cats.map(c=>{const n=P.filter(p=>p.category_id===c.id).length;return `<p style="margin-top:10px">${esc(c.name)} : ${n}<div class="bar" style="width:${n/P.length*100}%"></div></p>`}).join(""):'<p class="empty">Pas encore de données.</p>'}</div>
   <div class="panel"><h3>Dernières demandes</h3>${A.quotes.slice(0,5).map(q=>`<p style="margin-top:8px"><b>${esc(q.customer_name)}</b> – ${esc(q.status)}<br><small>${new Date(q.created_at).toLocaleDateString("fr-FR")}</small></p>`).join("")||'<p class="empty">Aucune demande.</p>'}</div></div>`,
  prod:()=>`<div class="top"><h2>Produits</h2><button class="btn sm" onclick="S.view='add';renderAdmin()">Ajouter</button></div><div class="panel">${P.length?`<table><tr><th></th><th>Nom</th><th>Catégorie</th><th>Prix</th><th>Qté</th><th>Type</th><th>Statut</th><th></th></tr>${P.map(p=>`<tr><td>${img(p)[0]?`<img src="${esc(img(p)[0].image_url)}" alt="">`:""}</td><td>${esc(p.name)}</td><td>${esc(p.categories?.name||"")}</td><td>${p.price_xaf?xaf(p.price_xaf):"Sur demande"}</td><td>${p.sales_type==="sur_commande"?"–":p.stock_quantity}</td><td>${SALES[p.sales_type]}</td><td>${p.is_published?"Publié":"Brouillon"}</td>
   <td style="white-space:nowrap"><button class="btn sm" onclick="togglePub('${p.id}',${!p.is_published})">${p.is_published?"Dépublier":"Publier"}</button> <button class="btn sm red" onclick="delProd('${p.id}')">Supprimer</button></td></tr>`).join("")}</table>`:'<p class="empty">Aucun produit. Ajoutez le premier.</p>'}</div>`,
  add:()=>`<div class="top"><h2>Ajouter un produit</h2></div><form class="f panel" onsubmit="addProd(event)"><label>Nom<input name="name" required maxlength="120"></label>
   <label>Description courte<input name="sd" required maxlength="200"></label><label>Description complète<textarea name="d" rows="4"></textarea></label>
   <div class="grid2"><label>Catégorie<select name="c" required><option value="">Choisir</option>${S.cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></label>
   <label>Type de vente<select name="s"><option value="en_stock">En stock</option><option value="sur_commande">Sur commande</option><option value="mixte">Mixte</option></select></label>
   <label>Prix en FCFA (vide = prix sur demande)<input name="pr" type="number" min="0" inputmode="numeric"></label><label>Quantité en stock<input name="q" type="number" min="0" value="0" inputmode="numeric"></label>
   <label>Dimensions<input name="di"></label><label>Matériaux<input name="m"></label></div><label>Finition<input name="fi"></label>
   <label>Photo principale (JPG, PNG ou WebP, 3 Mo max)<input name="img" type="file" accept="image/jpeg,image/png,image/webp"></label>
   <label><span><input type="checkbox" name="ft" style="width:auto"> Produit vedette</span></label><label><span><input type="checkbox" name="pb" style="width:auto"> Publier sur la vitrine</span></label><button class="btn wa" id="ab">Enregistrer le produit</button></form>`,
  stock:()=>`<div class="top"><h2>Stock</h2></div><div class="panel">${P.filter(p=>p.sales_type!=="sur_commande").length?`<table><tr><th>Produit</th><th>Quantité</th><th>État</th><th></th></tr>${P.filter(p=>p.sales_type!=="sur_commande").map(p=>`<tr><td>${esc(p.name)}</td><td>${p.stock_quantity}</td><td>${p.stock_quantity===0?'<span class="badge x">Rupture</span>':p.stock_quantity<=2?'<span class="badge o">Stock faible</span>':'<span class="badge">OK</span>'}</td><td><button class="btn sm" onclick="adjust('${p.id}',1)">Ajouter</button> <button class="btn sm out" onclick="adjust('${p.id}',-1)">Retirer</button></td></tr>`).join("")}</table>`:'<p class="empty">Aucun produit en stock à suivre.</p>'}</div>`,
  quotes:()=>`<div class="top"><h2>Demandes de devis</h2></div><div class="panel">${A.quotes.length?`<table><tr><th>Date</th><th>Client</th><th>Projet</th><th>Statut</th><th></th></tr>${A.quotes.map(q=>`<tr><td>${new Date(q.created_at).toLocaleDateString("fr-FR")}</td><td>${esc(q.customer_name)}<br><small>${esc(q.customer_phone)} · ${esc(q.city||"")}</small></td><td style="max-width:260px">${esc(q.project_description)}<br><small>${esc(q.requested_dimensions||"")}${q.budget_xaf?" · budget "+xaf(q.budget_xaf):""}</small></td>
   <td><select onchange="setQ('${q.id}',this.value)">${QSTAT.map(s=>`<option ${s===q.status?"selected":""}>${s}</option>`).join("")}</select></td><td><a class="btn sm wa" target="_blank" rel="noopener" href="https://wa.me/${q.customer_phone.replace(/\D/g,"").replace(/^(\d{9})$/,"237$1")}?text=${encodeURIComponent("Bonjour "+q.customer_name+", ici TGG Bois au sujet de votre demande de devis.")}">WhatsApp</a></td></tr>`).join("")}</table>`:'<p class="empty">Aucune demande pour le moment.</p>'}</div>`};
  $("#app").innerHTML=adminShell(views[S.view]());
}
const slug=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+Math.random().toString(36).slice(2,6);
async function addProd(e){
  e.preventDefault();const f=e.target,d=new FormData(f),b=$("#ab"),file=d.get("img");
  if(file&&file.size){if(!["image/jpeg","image/png","image/webp"].includes(file.type)||file.size>3e6)return toast("Image refusée : JPG, PNG ou WebP, 3 Mo maximum.",1)}
  b.disabled=true;b.textContent="Enregistrement…";
  const st=d.get("s"),qty=st==="sur_commande"?0:parseInt(d.get("q")||0);
  const row={name:d.get("name").trim(),slug:slug(d.get("name")),short_description:d.get("sd").trim(),description:d.get("d"),category_id:d.get("c"),price_xaf:d.get("pr")?parseInt(d.get("pr")):null,pricing_type:d.get("pr")?"fixe":"sur_demande",sales_type:st,stock_quantity:qty,dimensions:d.get("di")||null,materials:d.get("m")||null,finish:d.get("fi")||null,availability_status:st==="sur_commande"?"sur_commande":qty>0?"en_stock":"rupture",is_featured:!!d.get("ft"),is_published:!!d.get("pb")};
  try{
    const {data,error}=await db.from("products").insert(row).select().single();if(error)throw error;
    if(file&&file.size){
      const path=`${data.id}/${Date.now()}.${file.type.split("/")[1]}`;
      const up=await db.storage.from("product-images").upload(path,file,{contentType:file.type});if(up.error)throw up.error;
      const url=db.storage.from("product-images").getPublicUrl(path).data.publicUrl;
      const ir=await db.from("product_images").insert({product_id:data.id,image_url:url,alt_text:row.name,display_order:0,is_primary:true});if(ir.error)throw ir.error;
    }
    toast("Produit enregistré.");f.reset();await adminLoad();S.view="prod";renderAdmin();
  }catch(x){toast("Enregistrement impossible : "+(x.message||"erreur réseau"),1);b.disabled=false;b.textContent="Enregistrer le produit"}
}
async function togglePub(id,v){const {error}=await db.from("products").update({is_published:v}).eq("id",id);if(error)return toast("Action refusée.",1);toast(v?"Publié.":"Dépublié.");await adminLoad();renderAdmin()}
async function delProd(id){if(!confirm("Supprimer définitivement ce produit ?"))return;const {error}=await db.from("products").delete().eq("id",id);if(error)return toast("Suppression impossible (produit lié à une commande ?).",1);toast("Supprimé.");await adminLoad();renderAdmin()}
async function adjust(id,sign){
  const n=parseInt(prompt(sign>0?"Nombre d'unités à ajouter :":"Nombre d'unités à retirer :"));if(!n||n<1)return;
  const reason=prompt("Motif (obligatoire) :");if(!reason)return;
  const {error}=await db.rpc("adjust_stock",{p_product:id,p_delta:sign*n,p_reason:reason});
  if(error)return toast("Mouvement refusé : le stock ne peut pas devenir négatif.",1);toast("Stock mis à jour.");await adminLoad();renderAdmin();
}
async function setQ(id,s){const {error}=await db.from("quote_requests").update({status:s}).eq("id",id);toast(error?"Mise à jour refusée.":"Statut enregistré.",!!error);await adminLoad()}

/* ===== ROUTEUR ===== */
async function route(){
  const h=location.hash||"#/",[,r,a]=h.split("/");
  if(r==="admin"){
    if(!(await checkAdmin())){$("#app").innerHTML=loginView(S.user&&!S.admin?"Ce compte n'a pas le rôle administrateur.":"");return}
    await adminLoad();return renderAdmin();
  }
  if(!S.loaded){$("#app").innerHTML='<p style="padding:40px">Chargement…</p>';await load()}
  const html=r==="catalogue"?catalogue(a):r==="produit"?produit(a):home();
  $("#app").innerHTML=html;
  const anchor=h.split("#")[2];if(anchor)document.getElementById(anchor)?.scrollIntoView();else if(r!=="catalogue")scrollTo(0,0);
}
addEventListener("hashchange",()=>{if(!location.hash.slice(1).startsWith("/#"))S.cat=S.cat;route()});
route().catch(e=>{$("#app").innerHTML='<p style="padding:30px">Erreur : '+esc(e.message)+'</p>'});
</script>
</body>
</html>
